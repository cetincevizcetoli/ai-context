[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-context"
version = "1.4.0"
authors = [
  { name = "Ahmet Çetin" },
]
description = "AI modelleri için hızlı, güvenli ve etkileşimli proje bağlamı üreticisi."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
ai-context = "ai_context_core.cli:main"

[tool.setuptools]
py-modules = ["ai_context"]
packages = ["ai_context_core"]
